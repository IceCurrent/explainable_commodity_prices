[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eqcp"
version = "0.2.0"
description = "Explainable commodity prices: AE factors, macro panel, CCA mapping"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "torch>=2.0",
    "tabulate>=0.9.0",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "shap>=0.44",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
    "types-PyYAML",
]

[project.scripts]
eqcp-macro-panel = "eqcp.macro_processing.cli:main"
eqcp-mapping = "eqcp.pipelines.macro_mapping_cli:main"
eqcp-synthetic = "eqcp.synthetic.cli:main"
eqcp-forecast = "eqcp.pipelines.forecast_pbsv_cli:main"
eqcp-sectors = "eqcp.pipelines.sector_analysis:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: full real-data pipeline (not run in default CI)",
]
addopts = "-q --cov=eqcp --cov-report=term-missing:skip-covered --cov-fail-under=30"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
packages = ["eqcp"]
ignore_missing_imports = true
warn_unused_ignores = true
